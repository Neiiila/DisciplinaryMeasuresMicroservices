name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors solution-wide, so this gate also catches the
      # vulnerable-package advisories that central pinning is there to fix.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  images:
    name: Build ${{ matrix.service.name }} image
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity, dockerfile: src/Services/Identity/Identity.Api/Dockerfile }
          - { name: sanctions, dockerfile: src/Services/Sanctions/Sanctions.Api/Dockerfile }
          - { name: notifications, dockerfile: src/Services/Notifications/Notifications.Api/Dockerfile }
          - { name: gateway, dockerfile: src/Gateway/Gateway.Api/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Each service ships as its own image, so each is built independently.
      # The matrix runs them in parallel and fail-fast is off, so one broken
      # Dockerfile does not hide the state of the other three.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: disciplinary-measures/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: docker compose config --quiet
        env:
          JWT_KEY: a-key-used-only-to-satisfy-interpolation-in-ci
