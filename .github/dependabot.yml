version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Grouped so a framework bump arrives as one reviewable pull request
      # rather than a dozen that have to be merged in the right order.
      aspnetcore:
        patterns: ['Microsoft.AspNetCore.*', 'Microsoft.Extensions.*']
      entityframework:
        patterns: ['Microsoft.EntityFrameworkCore*']
      masstransit:
        patterns: ['MassTransit*']
      opentelemetry:
        patterns: ['OpenTelemetry*']
      testing:
        patterns: ['xunit*', 'FluentAssertions', 'NSubstitute', 'coverlet*', 'Microsoft.NET.Test.Sdk']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /src/Services/Identity/Identity.Api
    schedule:
      interval: monthly
